<script id="md-source" type="text/markdown"># 玩家行为与留存 — 国内 vs 海外对比版

> 截止 2026-10-07 · 脚本 `scripts/analyze-player-cohort.mjs --label 正式版`
> 本文档聚焦 **cn（国内，zone 1890）** 与 **overseas（海外 5 服 2890-2894 合并）** 的结构性差异分析。细节数据见两份分区报告（`report-cn-正式版.md` / `report-overseas-正式版.md`）。

## 1. 分析框架

```
       玩法偏好（参与率 / 人均场次 / 流失前触达深度）
                 ▲
    Cohort ──────┼────── 付费层级
    （4 组）     │     （8 档）
                 ▼
   留存曲线 / 流失率 / 事件效应
```

**6 大主题** = Cohort/付费档维度 × { 规模 / 流失率 / 留存 / 玩法参与 / 流失前状态 / 事件效应 }
每个主题都做 **cn vs overseas 并列呈现 + 差异分析**。

---

## 2. 核心口径

### 2.1 数据源（无新增拉取）

| 数据集 | 关键字段 | 真人过滤 |
|---|---|---|
| `login/*.csv` | `part_date, b_role_id, b_create_time_str` | 天然都是真人 |
| `ladder/*.csv` | 带 `player_type` | 脚本层 `=1` 过滤 |
| `tournament/*.csv` | 带 `player_type` | 脚本层 `=1` 过滤 |
| `infinity-gym/*.csv` | 挑战者 `b_role_id` | 天然都是真人 |
| `guild-war/*.csv` | 只有 2 列 | SQL 层 `=1` 已过滤 |
| `recharge.csv` | 累计全量、单位分 | — |

### 2.2 Cohort（9/17 单独拆出以隔离内测回归）

| Cohort | 入场时期 | 入场能玩 |
|---|---|---|
| A0 | 9/17（1 天，上线首日） | 天梯 + 道馆（含大量**内测回归**） |
| A1 | 9/18 ~ 9/24（7 天） | 同上 |
| B | 9/25 ~ 9/29（5 天） | A1 + 周赛 |
| C | 9/30 ~ 10/07（8 天） | B + 公会战 |

### 2.3 付费档（累计充值元）

0 氪 / 首充 ≤6 / 月卡 ≤36 / 通行证 ≤200 / 小 R+ ≤500 / 中 R ≤5000 / 大 R ≤20000 / 超 R >20000

### 2.4 流失定义（1 天激进口径）

```
是否流失 = (cutoff - lastLoginDate) ≥ 1 天
```

即 10/07 前就没登录 = 流失。

### 2.5 指标公式速查

| 指标 | 公式 |
|---|---|
| D_N 留存 | 分子 = 首登 + N 天登录过的玩家数；分母 = 首登 + N 天 ≤ cutoff 的玩家数 |
| 玩法参与率 | 该档玩过该玩法人数 / 该档总玩家数（全体口径） |
| 人均场次 | 场次总和 / **只算玩过的人** |
| 流失前触达率 | 该档流失玩家中碰过该玩法人数 / 该档流失总人数 |
| 事件回流率 | 休眠池（触发日前 7 天登过+前一天没登） → 触发日登录人数 / 休眠池 |

---

## 3. 核心数据对比

### 3.1 玩家规模 — cn 规模是海外 1.84x，但 A0 单日导流差 2.9x

**cn 国内（总 156 万）**：

| Cohort | 0氪 | 首充 | 月卡 | 通行证 | 小R+ | 中R | 大R | 超R | 合计 |
|---|---|---|---|---|---|---|---|---|---|
| A0 | 301,270 | 27,282 | 14,316 | 14,072 | 5,590 | 3,798 | 502 | 98 | **366,928** |
| A1 | 610,121 | 50,953 | 23,393 | 20,548 | 7,622 | 4,327 | 395 | 55 | **717,414** |
| B | 194,277 | 12,593 | 5,825 | 4,987 | 1,728 | 1,005 | 86 | 16 | **220,517** |
| C | 235,202 | 10,065 | 5,034 | 4,724 | 1,544 | 811 | 88 | 17 | **257,485** |

**overseas 海外（总 85 万）**：

| Cohort | 0氪 | 首充 | 月卡 | 通行证 | 小R+ | 中R | 大R | 超R | 合计 |
|---|---|---|---|---|---|---|---|---|---|
| A0 | 125,907 | 6,608 | 3,814 | 5,041 | 2,158 | 2,142 | 212 | 28 | **145,910** |
| A1 | 399,048 | 18,330 | 9,465 | 11,396 | 4,571 | 4,532 | 424 | 45 | **447,811** |
| B | 121,759 | 5,753 | 3,004 | 3,377 | 1,247 | 1,097 | 82 | 8 | **136,327** |
| C | 108,409 | 5,874 | 2,730 | 2,875 | 898 | 663 | 31 | 3 | **121,483** |

**对比速览**：

| 维度 | cn | overseas | 差异 |
|---|---|---|---|
| 总规模 | 156.2 万 | 85.2 万 | **cn 1.84x** |
| A0 规模（上线首日） | 36.7 万 | 14.6 万 | **cn 2.51x** |
| A1/A0 比值（日均 vs 首日） | A1 日均 10.2 万 ≈ A0 的 28% | A1 日均 6.4 万 ≈ A0 的 44% | **海外首日峰值不那么突出** |
| 0 氪占比 | 85.8% | 88.7% | **海外付费渗透更低 -2.9pp** |
| 大 R + 超 R 合计 | 1,383 | 843 | 两 region 都是千人级 |

**差异分析**：
- **cn 内测前置 → 上线首日峰值明显**：9/17 当日 36.7 万 ≈ 后 7 天 A1 日均的 3.6x；海外同比例仅 2.3x，说明 cn 内测回归玩家带来**上线首日导流峰值**，海外无同等前置量
- **海外 cohort C 保持稳定涌入**：cn C（9/30~10/07 8 天）累计 25.7 万 ≈ A1 日均流量的 35%；海外 C 累计 12.1 万 ≈ A1 日均流量的 42%，**海外新进玩家流稳定不衰减**，cn 后半月新进流量略有降速
- **海外付费渗透更低**：0 氪占比 88.7% vs cn 85.8%，差异 2.9pp —— 可能跟定价/支付渠道/用户购买力相关，但两 region 都是典型的"0 氪为主"结构，差异不足以质变

### 3.2 流失率 — 海外新进 cohort 显著更粘

**cn 国内**：

| Cohort | 0氪 | 首充 | 月卡 | 通行证 | 小R+ | 中R | 大R | 超R |
|---|---|---|---|---|---|---|---|---|
| A0 | 96.5% | 92.1% | 82.9% | 68.1% | 54.4% | 42.8% | 26.9% | 15.3% |
| A1 | 97.4% | 93.0% | 84.4% | 67.7% | 50.2% | 43.3% | 28.4% | 20.0% |
| B | 94.7% | 87.3% | 76.7% | 56.7% | 35.0% | 30.9% | 25.6% | 12.5% |
| C | 83.8% | 64.8% | 51.7% | 37.5% | 24.2% | 21.2% | 13.6% | 5.9% |

**overseas 海外**：

| Cohort | 0氪 | 首充 | 月卡 | 通行证 | 小R+ | 中R | 大R | 超R |
|---|---|---|---|---|---|---|---|---|
| A0 | 95.9% | 89.1% | 77.6% | 67.0% | 52.0% | 46.7% | 32.5% | 32.1% |
| A1 | 95.7% | 88.7% | 77.0% | 63.6% | 48.0% | 42.1% | 28.5% | 20.0% |
| B | 92.9% | 81.5% | 68.3% | 52.3% | 36.0% | 29.1% | 19.5% | 12.5% |
| C | 74.5% | 49.3% | 39.9% | 30.3% | 23.2% | 17.8% | 22.6% | 0.0% |

**差异分析**：
- **A0/A1 流失率两边高度一致**（0 氪都在 96%+，波动 <1pp）：两 region 上线首周的新手"进来一次就走"比例结构性相似
- **B/C 流失率海外系统性更低**：cn B 0 氪 94.7% vs 海外 92.9%，cn C 0 氪 **83.8%** vs 海外 **74.5%**（相对 cn 低 11.1%）—— 海外越晚进场的新玩家**流失率反而越低**，这是海外粘性优势的直接证据
- **可能原因**：
  - cn 后半月进场的玩家本身是"听朋友说/广告吸引"的二次拉新，质量不如首周主动来的；海外无内测前置，前后 cohort 都是同一波自然流量
  - 海外新手引导 / 本地化体验在后半月表现更稳定（但其实两 region 用的同一套客户端配置，这个假设需要进一步分 server 验证）
  - 海外 cohort C 窗口大部分 < 7 天 → 流失率天然偏低；但 cn 同窗口 C 流失率显著高于海外，排除纯窗口效应

| 首充 | 77.5% | 80.6% | 75.9% | 76.1% | 73.2% | 75.3% | 69.4% | 75.5% |
| 月卡 | 87.1% | 87.3% | 84.9% | 84.4% | 83.2% | 84.6% | 80.8% | 84.6% |

**D7 对比**（cn / overseas）：

| 付费档 | cn A0 | os A0 | cn A1 | os A1 | cn B | os B |

**D14 对比**（仅 A0/A1 可见）：

**差异分析**：
- **A0 两 region D1/D3/D7/D14 几乎同水位**：cn 内测回归把 cn A0 拉上来、与海外的天然留存持平
- **A1 以后 cn 全面落后海外**：
  - D1 0 氪：cn A1 32.1% vs os 35.4%（海外高 10%）、cn B 28.9% vs os 35.6%（海外高 23%）、cn C 23.7% vs os 35.3%（**海外高 49%**）
  - D3 0 氪：cn A1 14.4% vs os 18.6%（海外高 29%）、cn B 11.2% vs os 17.6%（海外高 57%）、cn C 10.6% vs os 17.7%（**海外高 67%**）
  - D7 0 氪：A1 海外高 32%、B 海外高 26%
  - D14 0 氪：**海外高 51%**
- **差距随 cohort 越晚越大**：cn A1→B→C 的 0 氪 D1 衰减到 23.7%，海外 A1→B→C 的 0 氪 D1 保持在 35%+ 水位几乎不衰减 → **海外新进玩家流的粘性结构性强于 cn**
- **中 R+ 两边趋近**：付费护城河压过文化差异，重氪玩家的粘性在两 region 都接近天花板
- **本质原因假设**：cn 内测回归玩家支撑了 A0 的高位但没传染到后续 cohort；海外没有"回归高峰"但新手自身的留存基线更高 —— 产品**对纯新手的教学/钩住能力两 region 差距显著**，cn 需要重点补强

|---|---|---|---|
| 0 氪 | 1.2% / 7.5 | **1.7% / 6.9** | 海外参与率 +42% |
| 月卡 | 10.9% / 9 | **12.7% / 8** | 海外参与率 +17% |
| 中 R | 43.5% / 29 | 42.0% / 23 | **cn 场次 +26%** |
| 超 R | 75.3% / 117 | 72.6% / 58 | **cn 场次 +102%** |

**差异分析**（这是最清晰的两 region 行为差异）：
- **海外玩家更"广"**：所有付费档对公会战、周赛的触达率都更高（0 氪公会战 +42%、周赛 +42%）；低付费档对道馆/天梯参与率也略高 → **海外玩家更愿意尝试多种玩法**
- **cn 玩家更"深"**：一旦碰过某玩法，场次深度显著更高 —— cn 中 R 道馆 336 场 vs 海外 266 场、cn 超 R 周赛 117 场 vs 海外 58 场（+102%！）—— **cn 玩家呈现"钻一个玩深"的行为模式**
- **解读**：
  - 海外玩家总游戏时长可能更分散（多游戏切换），所以对多玩法广度覆盖；但单个玩法钻研不深
  - cn 玩家进入游戏后更集中精力刷单玩法（道馆是绝对的场次之王），文化上倾向"把一个事情做到极致"
  - **公会战对低付费档的参与率海外显著更高**：说明海外对"社交型玩法"的进入门槛更低，cn 低付费档可能对公会组织/帮派文化不感冒

### 3.5 流失前玩家状态 — 流失结构同构，但海外重氪流失走得"更深"

**流失总规模**：cn 1,434,831 人 vs 海外 760,453 人

**0 氪流失触达率**（流失玩家中碰过某玩法的占比）：

| 玩法 | cn 0 氪流失 | 海外 0 氪流失 | 差异 |
|---|---|---|---|
| 天梯 | 17.3% | 17.1% | 同构 |
| 主线道馆 | 8.8% | 8.5% | 同构 |
| 赛季道馆 | 1.6% | 1.3% | cn 略高 |
| 周赛 | 0.6% | 0.8% | 海外略高 |
| 公会战 | 1.4% | 1.8% | 海外高 29% |

**超 R 流失（样本小但对比鲜明）**：

| 指标 | cn 超 R（流失 29 人）| 海外 超 R（流失 19 人）|
|---|---|---|
| 天梯最高段位 avg | **73 / 黄金** | **114 / 钻石** |
| 主线道馆 avg 层 | 175 | **193** |
| 赛季道馆 avg 层 | 97 | 96 |
| 周赛 avg 场次 | 82 | 29 |
| 公会战 avg 场次 | 104 | **280** |

**差异分析**：
- **低档流失结构两 region 高度同构**：无论 cn 还是海外，0 氪流失的 80%+ 都是「连一个玩法都没碰」的走马灯玩家 —— 两 region 的"新手劝退"结构性原因一致
- **海外超 R 流失走得"更深"**：
  - 海外超 R 流失前天梯平均打到钻石（rank 114），cn 只到黄金前段（rank 73）—— 海外重氪玩家流失前的内容消耗更彻底
  - 公会战场次：海外超 R 280 场 vs cn 104 场（**2.7x**） —— 对应公会战是海外重氪玩家的核心日常玩法
  - 道馆：海外超 R 主线道馆 193 层 vs cn 175 层，海外玩家流失前走得更远
- **解读**：
  - 海外超 R 流失不是"没内容"而是"内容玩完了"—— 内容天花板到了之后仍然流失，说明长线留存需要更强的持续动力（赛季轮换 / 社交粘性）
  - cn 超 R 流失时还没把内容玩透，可能流失原因是**内容外的因素**（氪金性价比、服务体验等）—— 两 region 对重氪玩家流失原因的诊断需要分开看

### 3.6 事件效应 — 公会战是 cn 回流抓手，海外玩家对事件无感

| 事件 | cn 回流率 | 海外回流率 |
|---|---|---|
| 📏 对照 9/22（常驻周一） | 3.7% | **4.9%** |
| 📏 对照 9/29（公会战前） | 3.8% | **5.5%** |
| 📢 周赛首开 9/25 | 4.5%（+20%） | 4.6%（**-8%**）|
| ⚔️ 公会战首开 9/30 | **5.4%（+44%）** | 5.5%（0%）|

> 括号内 = 相对各自对照均值的净提升

**差异分析**：
- **cn 公会战首开净提升 +44%**（周赛 +20%），**海外公会战净提升 0%**（周赛 -8%）
- **本质原因**：海外自然回流基线 **5.2% vs cn 3.75%**（高 39%），休眠玩家自然"过几天来看看"的比例更高，新玩法事件效应被稀释
- **战术含义**：
  - cn 应继续加强周期玩法节奏（公会战尤其有效），作为召回核心手段
  - 海外事件相当于"锦上添花"，运营重点应该放在**提升整体内容广度和日常粘性**（跟 3.4 "海外玩家更广度覆盖"呼应）

## 4. 核心观察（cn vs overseas 差异）

1. **cn 规模 1.84x、A0 单日峰值 2.51x**：内测前置效应把 cn 首日拉爆，但长期流量 cohort 结构两边趋近

2. **海外新手自然粘性结构性强于 cn**（横跨 D1/D3/D7/D14 全口径）：
   - **D1 0 氪**：cn C 23.7% vs 海外 C 35.3%（**海外高 49%**）
   - **D3 0 氪**：cn C 10.6% vs 海外 C 17.7%（**海外高 67%**）
   - **D7 0 氪**：cn A1 7.9% vs 海外 A1 10.5%（**海外高 32%**）
   - **D14 0 氪**：cn A1 3.5% vs 海外 A1 5.3%（**海外高 51%**）
   - 差距随 cohort 越晚越大：cn A1→B→C 0 氪 D1 衰减到 23.7%，海外保持 35%+ 水位几乎不衰减
   - 中 R+ 两边趋近，付费护城河压过文化差异

3. **cn A0 的高留存靠内测回归撑着**：A0 vs A1 D7 0 氪，cn +41% vs 海外 +12%（内测回归效应 cn 比海外强 3.4 倍）

4. **cn A1/B/C 跟海外同 cohort 对比全面落后**：产品**对纯新手的教学/钩住能力两 region 差距显著**，cn 需要补强

5. **玩法行为模式分化**：
   - **海外玩家"广"**：公会战 0 氪参与率 +42%、周赛 +42%，愿意尝试多玩法
   - **cn 玩家"深"**：中 R 道馆 336 场 vs 海外 266 场、超 R 周赛 117 vs 58（+102%），进入某玩法后钻研极深
   - 文化差异体现得非常清楚：海外"浅尝多面"、cn"钻一个玩深"

6. **流失结构同构但层次不同**：
   - 0 氪流失触达结构两 region 几乎一致（都是 80%+ 的"走马灯"）→ **新手劝退是产品问题而非地区问题**
   - 超 R 流失：海外走的时候已到钻石/193 层/公会战 280 场，cn 只到黄金/175 层/104 场 → **海外重氪流失是"内容玩完了"，cn 重氪流失是"玩到一半因为别的原因走了"**

7. **公会战是 cn 回流抓手、海外日常玩法**：
   - cn 公会战首开净提升 +44%，海外 0%
   - 海外自然基线 5.2% vs cn 3.75%（高 39%），海外休眠玩家回流本来就比 cn 容易，事件效应被稀释

8. **公会战对低付费档的触达差异最大**：海外 0 氪参与率 4.4% vs cn 3.1%（+42%）—— 海外玩家对社交型玩法的进入门槛更低
